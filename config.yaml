# Optional theme/topic hint passed to the story generator (leave blank for variety)
story_topic_hint: ""

# Target narration length in words (~5.6 words/sec spoken at the voice_rate below)
target_story_words: 220

# edge-tts voice. Run `edge-tts --list-voices` to see all options.
voice: en-US-ChristopherNeural

# Narration speed, as a percent offset from normal (e.g. "+25%", "+0%", "-10%").
# Faster speech = more words fit in a short runtime, which tends to help retention.
# +80% roughly matches the fast-paced narration style common in viral reddit-story videos.
voice_rate: "+80%"

# How many videos to produce per pipeline run
videos_per_run: 1

# Output video resolution (9:16 vertical)
video_width: 1080
video_height: 1920

# Cut the background footage into this many segments (different clip each time, with a
# crossfade transition between cuts). Segments favor an even time split, but a clip
# shorter than its share yields time to clips with more footage rather than looping.
background_segments: 3

# Display name shown on the fake post "hook card" at the start of each video
channel_username: StoryHub

# Caption styling
caption_font: assets/fonts/Fredoka-Bold.ttf
caption_font_size: 90
caption_color: white
caption_stroke_color: black
caption_stroke_width: 4

# Background music (optional). Leave blank to disable.
background_music: ""
background_music_volume: 0.08
